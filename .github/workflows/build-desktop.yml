name: Build Desktop Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE / MSI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        run: choco install wixtoolset -y
        shell: pwsh

      - name: Package Windows EXE and MSI
        run: ./gradlew.bat :desktopApp:packageExe :desktopApp:packageMsi --stacktrace
        shell: pwsh

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-Windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*
            desktopApp/build/compose/binaries/main/msi/*

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package macOS DMG
        run: ./gradlew :desktopApp:packageDmg --stacktrace

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-macOS
          path: desktopApp/build/compose/binaries/main/dmg/*

  build-linux:
    name: Build Linux DEB / RPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Linux DEB and RPM
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm --stacktrace

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-Linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*
            desktopApp/build/compose/binaries/main/rpm/*

  create-release:
    name: Create GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-Windows
          path: artifacts/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-macOS
          path: artifacts/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-Linux
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
          draft: false
          prerelease: false
