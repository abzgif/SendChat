name: Build SendChat Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE / MSI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset
        run: choco install wixtoolset -y
        shell: pwsh

      - name: Package Windows EXE and MSI
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            ./gradlew.bat :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi "-PappVersion=$version" --stacktrace
          } else {
            ./gradlew.bat :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi --stacktrace
          }
        shell: pwsh

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-Windows
          path: |
            desktopApp/build/compose/binaries/main/exe/*
            desktopApp/build/compose/binaries/main/msi/*
            desktopApp/build/compose/binaries/main-release/exe/*
            desktopApp/build/compose/binaries/main-release/msi/*

  build-macos:
    name: Build macOS installers
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package macOS DMG and PKG
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./gradlew :desktopApp:packageReleaseDmg :desktopApp:packageReleasePkg "-PappVersion=${GITHUB_REF_NAME#v}" --stacktrace
          else
            ./gradlew :desktopApp:packageReleaseDmg :desktopApp:packageReleasePkg --stacktrace
          fi

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-macOS
          path: |
            desktopApp/build/compose/binaries/main/dmg/*
            desktopApp/build/compose/binaries/main/pkg/*
            desktopApp/build/compose/binaries/main-release/dmg/*
            desktopApp/build/compose/binaries/main-release/pkg/*

  build-linux:
    name: Build Linux DEB / RPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot libasound2-dev

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Linux DEB and RPM
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm "-PappVersion=${GITHUB_REF_NAME#v}" --stacktrace
          else
            ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm --stacktrace
          fi

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: SendChat-Linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*
            desktopApp/build/compose/binaries/main/rpm/*
            desktopApp/build/compose/binaries/main-release/deb/*
            desktopApp/build/compose/binaries/main-release/rpm/*

  create-release:
    name: Create GitHub Release
    needs: [ build-windows, build-macos, build-linux ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-Windows
          path: artifacts/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-macOS
          path: artifacts/macos

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: SendChat-Linux
          path: artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SendChat ${{ github.ref_name }}"
          body: |
            ### SendChat ${{ github.ref_name }} Release Notes

            - **📉 App Size Optimization**: JLink ZIP compression configured for runtime modules, stripping unneeded runtime overhead across Windows, macOS, and Linux (~25MB module footprint reduction), and optimized Android packaging with R8 full mode.
            - **💬 App-to-Web File & Message Transfers**: Seamlessly send text messages, clipboard snippets, images, and files directly from the SendChat "Web Browser" chat room to connected browsers.
            - **🌐 Enhanced Web Portal Chat**: Redesigned "Send Text" tab with full sent and received message bubbles, 12-hour timestamps, and one-click copy buttons with instant visual feedback.
            - **🟢 Active Webpage Status & Identification**: Web sessions now clearly show as "Webpage • <IP>" with live active status indicators instead of "Unknown / Offline".
            - **🛠️ Stability & Polish**: Fixes for connection timeouts and delivery errors when chatting with web clients.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.deb
            artifacts/**/*.rpm
          draft: false
          prerelease: false
          generate_release_notes: true
